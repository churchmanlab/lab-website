media:
  - name: images
    label: Website images
    input: public/images
    output: /images
    categories: [image]
    rename: safe
  - name: documents
    label: PDFs and documents
    input: public/documents
    output: /documents
    categories: [document]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {name}"
      update: "content: update {name}"
      delete: "content: remove {name}"
      rename: "content: rename {oldFilename} to {newFilename}"

components:
  rich_text:
    type: rich-text
    options:
      format: html
      media: images
      switcher: true
  image:
    type: image
    options:
      media: images
  link:
    type: object
    fields:
      - name: label
        label: Link text
        type: string
        required: true
      - name: href
        label: Link URL
        type: string
        required: true
  current_member:
    type: object
    fields:
      - name: name
        type: string
        required: true
      - name: degree
        type: string
      - name: role
        type: string
        required: true
      - name: detail
        label: Education or detail
        type: text
      - name: award
        type: text
      - name: email
        type: string
      - name: photo
        component: image
      - name: href
        label: Profile link
        type: string
      - name: pi
        label: Principal investigator
        type: boolean
      - name: homeLab
        label: Home lab
        type: string
      - name: homeLabUrl
        label: Home lab URL
        type: string
      - name: homeLabInstitution
        label: Home lab institution
        type: string
  alumnus:
    type: object
    fields:
      - name: name
        type: string
        required: true
      - name: now
        label: Current position
        type: text
      - name: href
        label: Profile link
        type: string
  publication:
    type: object
    fields:
      - name: authors
        type: text
        required: true
        description: Wrap Churchman Lab authors in double asterisks, for example **Churchman LS**.
      - name: title
        type: text
        required: true
      - name: journal
        type: string
        required: true
      - name: year
        type: number
        required: true
      - name: type
        type: select
        required: true
        options:
          values:
            - name: research
              label: Research article
            - name: review
              label: Review or commentary
            - name: protocol
              label: Protocol
            - name: preprint
              label: Preprint
      - name: volume
        type: string
      - name: pages
        type: string
      - name: doi
        label: DOI
        type: string
      - name: pmid
        label: PubMed ID
        type: string
      - name: pdf
        label: PDF path
        type: string
      - name: image
        component: image
      - name: imageKind
        label: Image kind
        type: select
        options:
          values: [cover, page]
      - name: imageW
        label: Image width
        type: number
      - name: imageH
        label: Image height
        type: number
      - name: noImage
        label: Why no image is available
        type: text
  research_topic:
    type: object
    fields:
      - name: title
        type: string
        required: true
      - name: body
        component: rich_text
        required: true
      - name: openQuestions
        label: Open questions
        component: rich_text
      - name: backgroundReading
        label: Background reading
        component: rich_text
  protocol:
    type: object
    fields:
      - name: name
        type: string
        required: true
      - name: citation
        type: text
        required: true
      - name: links
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
      - name: correction
        label: Correction since publication
        component: rich_text
  album:
    type: object
    fields:
      - name: id
        label: Album ID
        type: string
        required: true
        description: Used in image paths. Change only when the matching folder is renamed.
      - name: title
        type: string
        required: true
      - name: date
        type: string
        required: true
      - name: location
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: cover
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{file}"
        fields:
          - name: file
            type: string
            required: true
            description: Filename without the .jpg extension.
          - name: alt
            label: Image description
            type: text
            required: true
      - name: groups
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Photos by {credit}"
        fields:
          - name: credit
            type: string
            required: true
          - name: files
            type: string
            list: true
            required: true

