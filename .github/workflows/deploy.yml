name: Deploy to GitHub Pages

# Every push to main rebuilds the preview at
# https://churchmanlab.github.io/lab-website/
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level so the build and the link checker always agree on the base path.
    # check-links.mjs resolves hrefs against SITE_BASE; when only the build step
    # set it, the checker saw base "/" and reported every prefixed link as broken.
    env:
      SITE: https://churchmanlab.github.io
      SITE_BASE: /lab-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check for broken internal links
        run: npm run check:links

      - name: Check for British spellings
        run: npm run check:spelling

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Pull requests build and link-check, but only main actually publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
